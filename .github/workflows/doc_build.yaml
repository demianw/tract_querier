name: Build docs

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      # Needed to publish the documentation to the gh-pages branch
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade --user pip setuptools coverage
        pip install .[doc]

    - name: Build docs
      run: |
          make -C doc/ SPHINXOPTS="-v" BUILDDIR="$HOME/docs" OUTDIR="$HOME/html" html

    - name: Check out gh-pages branch
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages

    - name: Publish docs to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
          rsync -a --delete --exclude .git "$HOME/docs/html/" gh-pages/
          touch gh-pages/.nojekyll
          cd gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "Documentation unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "DOC: Publish documentation for ${GITHUB_SHA}"
          git push origin gh-pages
